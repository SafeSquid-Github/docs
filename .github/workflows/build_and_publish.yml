name: Validate documentation

run-name: Docs validation — ${{ github.actor }}

on:
  push:
    branches:
      - main
      - dev
      - mintlify-docs
  pull_request:
    branches:
      - main
      - dev
      - mintlify-docs

permissions:
  contents: read

concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mintlify validate
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate Mintlify project
        run: npm run validate
